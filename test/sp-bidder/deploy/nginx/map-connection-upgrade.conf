# Websocket upgrade helper for the socket.io live feed.
# Install ONCE into the http{} context:  /etc/nginx/conf.d/map-connection-upgrade.conf
# (Skip if a `map $http_upgrade $connection_upgrade` is already defined on this box -
#  nginx errors on a duplicate map.)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
