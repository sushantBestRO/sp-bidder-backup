<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BidPilot — price requests</title>
<link rel="preload" href="/fonts/hanken-500.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/fonts/fraunces-500.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/styles.css" />
<style>
  /* worklist-specific, on the shared BidPilot tokens (styles.css :root) */
  .wl { display:flex; flex-direction:column; gap:12px; }
  .wl-row {
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
    box-shadow:var(--shadow-sm); padding:16px 18px;
  }
  .wl-row[data-status="awaiting_price"] { border-color:var(--warn-tint); }
  .wl-main { min-width:0; }
  .wl-side { display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex:none; }
  .badge2 { font-size:12px; font-weight:600; padding:4px 10px; border-radius:var(--radius-pill); white-space:nowrap; }
  .b-await  { color:var(--warn);   background:var(--warn-tint); }
  .b-armed  { color:var(--accent); background:var(--accent-tint); }
  .b-skip   { color:var(--danger); background:var(--danger-tint); }
  .b-closed { color:var(--muted);  background:var(--fill); }
  .wl-act { display:flex; gap:8px; }
  .btn2 {
    font:600 12.5px var(--sans); padding:6px 12px; border-radius:var(--radius-sm); cursor:pointer;
    border:1px solid var(--accent); background:var(--accent); color:#fff; text-decoration:none; display:inline-block;
  }
  .btn2:hover { background:var(--accent-hover); }
  .btn2.ghost { background:var(--surface); color:var(--text-2); border-color:var(--border-strong); }
  .wl-note { font-size:12.5px; color:var(--muted); }
  .wl-note b { color:var(--ink); }
  .wl-shipnote { margin-top:8px; font-size:12.5px; line-height:1.5; color:var(--ink); background:var(--warn-tint); border-radius:var(--radius-sm); padding:8px 10px; white-space:pre-line; overflow-wrap:anywhere; }
  .wl-shipnote b { color:var(--warn); }
  /* full pickup/drop addresses; long lines wrap inside .wl-main (min-width:0), never widen the row */
  .wl-pts { margin-top:6px; display:grid; gap:2px; }
  .wl-pt { font-size:12.5px; line-height:1.5; color:var(--text-2); overflow-wrap:anywhere; }
  .wl-pt b { color:var(--muted); font-weight:600; }
  .wl-main .wl-note { margin-top:6px; }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">BidPilot</span>
      <span class="brand-sub">price requests</span>
    </div>
    <div class="conn" data-state="connected">
      <span class="conn-dot" aria-hidden="true"></span>
      <span class="conn-text" id="connText">Live</span>
    </div>
  </header>

  <main class="stage">
    <p class="lede" id="lede">Loading&hellip;</p>
    <div class="wl" id="list"></div>
  </main>

  <div class="toast" id="toast" hidden></div>
  <script src="/worklist.js"></script>
</body>
</html>
