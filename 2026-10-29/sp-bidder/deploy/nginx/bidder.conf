# SuperProcure auto-bidder - reverse-proxy vhost.
#
# CO-TENANT SAFETY: this is a SEPARATE server block. Do NOT edit any existing vhost
# on this box. Apply with a graceful RELOAD (not restart) so other sites keep their
# live connections:  sudo nginx -t && sudo systemctl reload nginx
#
# Front-door model:
#   - The app binds 127.0.0.1:4103 only (never exposed directly).
#   - /price/<token>  -> PUBLIC  (the tokenized link is its own auth; pricing team on phones).
#   - everything else -> HTTP Basic Auth over TLS (operator console + /api + socket.io live feed).
#
# This is what's actually deployed as of the Jul 10 2026 bids.auto-pilot.best cutover
# (STATUS.md). Two deviations from an earlier draft of this file, kept here so a future
# redeploy doesn't repeat the same nginx -t failure:
#   - auth_basic_user_file reuses the sibling bid-command vhost's .bid-command.htpasswd
#     (same ops credentials, no second password to distribute) instead of a fresh
#     .sp-bidder.htpasswd that nothing on the box ever created.
#   - No $connection_upgrade / websocket-upgrade headers - that map isn't defined
#     anywhere in this box's nginx config, and the sibling vhost has run fine without it
#     (socket.io falls back to long-polling). Add map-connection-upgrade.conf to
#     /etc/nginx/conf.d/ first if you want true websocket upgrade.
#
# One-time setup before enabling:
#   1. DNS: point  bidder.<your-domain>  ->  this server's public IP.
#   2. Basic-auth file (outside any repo, skip if reusing an existing one):
#        sudo apt-get install -y apache2-utils
#        sudo htpasswd -c /etc/nginx/.sp-bidder.htpasswd opsuser     # add more users without -c
#   3. TLS cert - issued via webroot so certbot never auto-edits this hand-authored file:
#        sudo mkdir -p /var/www/bidder-acme
#        # install ONLY the port-80 server block below first, symlink, nginx -t, reload
#        sudo certbot certonly --webroot -w /var/www/bidder-acme -d bidder.<your-domain>
#        # then add the HTTPS server block (cert now exists), nginx -t, reload again
#
# Then replace every  bids.auto-pilot.best  below with your real subdomain.

upstream sp_bidder {
    server 127.0.0.1:4103;
    keepalive 16;
}

# --- HTTP -> HTTPS redirect + ACME HTTP-01 challenge path ---
server {
    listen 80;
    listen [::]:80;
    server_name bidds.auto-pilot.best;                 # <-- set your subdomain
    location /.well-known/acme-challenge/ { root /var/www/bidder-acme; }
    location / { return 301 https://$host$request_uri; }
}

# --- HTTPS vhost ---
server {
    # http2 as a listen parameter is correct for nginx 1.24.0 (Ubuntu 24.04 default). On nginx >= 1.25.1
    # the parameter is deprecated - move to a separate "http2 on;" directive if the box is upgraded.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bidds.auto-pilot.best;                 # <-- set your subdomain

    #ssl_certificate     /etc/letsencrypt/live/bids.auto-pilot.best/fullchain.pem;
    #ssl_certificate_key /etc/letsencrypt/live/bids.auto-pilot.best/privkey.pem;

    ssl_certificate     /etc/letsencrypt/live/bidds.auto-pilot.best/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bidds.auto-pilot.best/privkey.pem;

    # security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # HSTS: TLS is LE-backed and auto-renews, so pinning the browser to https is safe. No preload (that needs registry submission).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 1m;

    # shared proxy settings
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # PUBLIC: the pricing team's tokenized cost-capture page. No login by design.
    location /price/ {
        proxy_pass http://sp_bidder;
    }

    # GATED: operator console, /api, and /socket.io live feed.
    location / {
        auth_basic           "Best Roadways - Bidder Console";
        auth_basic_user_file /etc/nginx/.bid-command.htpasswd;
        proxy_pass http://sp_bidder;
    }
}
